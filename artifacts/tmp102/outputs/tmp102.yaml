esphome:
  name: dut
  on_boot:
    then:
      - component.update: temperature

esp32: 
  variant: esp32c3 # Use always
  framework:
    type: esp-idf

#wifi:
#  ssid: !secret wifi_ssid
#  password: !secret wifi_password

#api:
#ota:
#  platform: esphome
logger:
  hardware_uart: UART0

i2c:
  sda: 4
  scl: 5

sensor:
  - platform: tmp102
    id: temperature
    name: "Temperature"
    address: 0x48
    update_interval: 60s
    on_value:
      then:
        - lambda: !lambda |-
            if (isnan(x)) return;
            ESP_LOGI("tmp102", "Temperature = %.1f C", x);



