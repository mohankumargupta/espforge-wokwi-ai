esphome:
  name: dut
  on_boot:
    - component.update: tmp102_sensor

esp32: 
  variant: esp32c3 # Use always
  framework:
    type: esp-idf

#wifi:
#  ssid: !secret wifi_ssid
#  password: !secret wifi_password

#api:
#ota:
#  platform: esphome
logger:
  hardware_uart: UART0

# TMP102 canonical test on the primary I2C bus (sda=4, scl=5)
i2c:
  sda: 4
  scl: 5

sensor:
  - platform: tmp102
    id: tmp102_sensor
    name: "Temperature"
    update_interval: 60s
    on_value:
      then:
        - logger.log:
            format: "Temperature = %.1f C"
            args: ['id(tmp102_sensor).state']



