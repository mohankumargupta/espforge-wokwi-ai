esphome:
  name: dut
  on_boot:
    - priority: 250
      then:
        - delay: 1500ms
        - lambda: |-
            auto *sensor = id(dut_temp);
            ESP_LOGI("tmp102", "Temperature = %.1f C", sensor->state);

esp32: 
  variant: esp32c3 # Use always
  framework:
    type: esp-idf

#wifi:
#  ssid: !secret wifi_ssid
#  password: !secret wifi_password

#api:
#ota:
#  platform: esphome
logger:
  hardware_uart: UART0

i2c:
  sda: GPIO4
  scl: GPIO5
  scan: false

sensor:
  - platform: tmp102
    id: dut_temp
    name: "Temperature"
    address: 0x48
    update_interval: 1s



