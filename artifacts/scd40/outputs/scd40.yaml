esphome:
  name: dut
  on_boot:
    - then:
        - component.update: scd40

esp32: 
  variant: esp32c3 # Use always
  framework:
    type: esp-idf

#wifi:
#  ssid: !secret wifi_ssid
#  password: !secret wifi_password

#api:
#ota:
#  platform: esphome
logger:
  hardware_uart: UART0

i2c:
  sda: 4
  scl: 5

sensor:
  - platform: scd4x
    id: scd40
    update_interval: 5s
    co2:
      name: "SCD40 CO2"
      on_value:
        - lambda: |-
            ESP_LOGI("scd40_test", "CO2 = %.0f ppm", x);
    temperature:
      name: "SCD40 Temperature"
      on_value:
        - lambda: |-
            ESP_LOGI("scd40_test", "Temperature = %.2f C", x);
    humidity:
      name: "SCD40 Humidity"
      on_value:
        - lambda: |-
            ESP_LOGI("scd40_test", "Humidity = %.2f %%", x);



