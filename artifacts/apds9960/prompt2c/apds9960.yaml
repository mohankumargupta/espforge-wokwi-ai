esphome:
  name: dut
  on_boot:
    then:
      - component.update: apds9960_hub

esp32: 
  variant: esp32c3 # Use always
  framework:
    type: esp-idf

#wifi:
#  ssid: !secret wifi_ssid
#  password: !secret wifi_password

#api:
#ota:
#  platform: esphome
logger:
  hardware_uart: UART0

i2c:
  sda: 4
  scl: 5

apds9960:
  id: apds9960_hub
  address: 0x39

sensor:
  - platform: apds9960
    id: apds9960_clear
    type: CLEAR
    name: "Clear channel"
    on_value:
      then:
        - lambda: |-
            ESP_LOGI("qa_test", "Clear channel = %.1f %%", x);
  - platform: apds9960
    id: apds9960_red
    type: RED
    name: "Red channel"
    on_value:
      then:
        - lambda: |-
            ESP_LOGI("qa_test", "Red channel = %.1f %%", x);
  - platform: apds9960
    id: apds9960_green
    type: GREEN
    name: "Green channel"
    on_value:
      then:
        - lambda: |-
            ESP_LOGI("qa_test", "Green channel = %.1f %%", x);
  - platform: apds9960
    id: apds9960_blue
    type: BLUE
    name: "Blue channel"
    on_value:
      then:
        - lambda: |-
            ESP_LOGI("qa_test", "Blue channel = %.1f %%", x);
  - platform: apds9960
    id: apds9960_proximity
    type: PROXIMITY
    name: "Proximity"
    on_value:
      then:
        - lambda: |-
            ESP_LOGI("qa_test", "Proximity = %.1f %%", x);
