esphome:
  name: dut
  on_boot:
    - priority: 600
      then:
        - component.update: dht22

esp32: 
  variant: esp32c3 # Use always
  framework:
    type: esp-idf

#wifi:
#  ssid: !secret wifi_ssid
#  password: !secret wifi_password

#api:
#ota:
#  platform: esphome
logger:
  hardware_uart: UART0


sensor:
  - platform: dht
    id: dht22
    model: DHT22
    pin: GPIO3
    temperature:
      name: "Temperature"
      accuracy_decimals: 1
      on_value:
        - logger.log:
            format: "Temperature = %.1f C"
            args: ['x']
    humidity:
      name: "Humidity"
      accuracy_decimals: 1
      on_value:
        - logger.log:
            format: "Humidity = %.1f %%"
            args: ['x']
    update_interval: 60s



